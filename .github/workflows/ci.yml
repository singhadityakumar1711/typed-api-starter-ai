name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: typed_api_starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d typed_api_starter"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/typed_api_starter
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -v
